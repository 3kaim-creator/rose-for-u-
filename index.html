```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose For You From AIM 🌹</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at bottom, #172044, #080b1c 65%, #02030b);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    color: white;
}

/* STARS */
.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate,
               float 8s infinite linear;
}

@keyframes twinkle {
    from { opacity: .2; transform: scale(.6); }
    to { opacity: 1; transform: scale(1.5); }
}

@keyframes float {
    from { translate: 0 0; }
    to { translate: 30px -50px; }
}

/* MOON */
.moon {
    position: absolute;
    top: 9%;
    right: 15%;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #fff3d1;
    box-shadow: 0 0 35px #fff1b8, 0 0 90px #ffffff55;
}

/* MAIN */
.container {
    position: relative;
    z-index: 2;
    text-align: center;
}

h1 {
    font-size: clamp(23px, 5vw, 38px);
    color: #ffd6e4;
    text-shadow: 0 0 15px #ff477e;
    opacity: 0;
    transform: translateY(20px);
    transition: 1.5s ease;
    margin-top: 40px;
}

h1.show {
    opacity: 1;
    transform: translateY(0);
}

.subtitle {
    color: #e9c5d5;
    margin-top: 12px;
    letter-spacing: 3px;
    opacity: 0;
    transition: 2s;
}

.subtitle.show {
    opacity: 1;
}

/* ROSE */
.rose {
    position: relative;
    width: 160px;
    height: 230px;
    margin: auto;
    cursor: pointer;
}

.stem {
    position: absolute;
    width: 5px;
    height: 125px;
    background: linear-gradient(to right, #164b28, #48a35b);
    left: 78px;
    top: 90px;
    border-radius: 10px;
}

.leaf {
    position: absolute;
    width: 40px;
    height: 20px;
    background: #287c42;
    border-radius: 100% 0 100% 0;
    top: 155px;
    left: 40px;
    transform: rotate(20deg);
}

.leaf.right {
    left: 82px;
    transform: rotate(75deg);
}

.flower {
    position: absolute;
    width: 100px;
    height: 100px;
    left: 30px;
    top: 15px;
    transform: scale(.8);
    transition: transform 2s ease;
    filter: drop-shadow(0 0 15px #ff174f88);
}

.petal {
    position: absolute;
    width: 48px;
    height: 65px;
    background: linear-gradient(135deg, #ff799c, #d90042 75%);
    border-radius: 50% 50% 35% 35%;
    transform-origin: bottom center;
    bottom: 10px;
    left: 26px;
    transition: transform 2s cubic-bezier(.2,.8,.3,1);
}

.petal:nth-child(1) { transform: rotate(0deg); }
.petal:nth-child(2) { transform: rotate(72deg); }
.petal:nth-child(3) { transform: rotate(144deg); }
.petal:nth-child(4) { transform: rotate(216deg); }
.petal:nth-child(5) { transform: rotate(288deg); }

.center {
    position: absolute;
    width: 32px;
    height: 32px;
    background: radial-gradient(circle, #ffb1c6, #a90034);
    border-radius: 50%;
    left: 34px;
    top: 44px;
    z-index: 3;
}

.open .flower {
    transform: scale(1.2);
}

.open .petal:nth-child(1) { transform: rotate(-30deg) translateY(-20px); }
.open .petal:nth-child(2) { transform: rotate(55deg) translate(20px,-5px); }
.open .petal:nth-child(3) { transform: rotate(125deg) translate(20px,5px); }
.open .petal:nth-child(4) { transform: rotate(235deg) translate(-20px,5px); }
.open .petal:nth-child(5) { transform: rotate(305deg) translate(-20px,-5px); }

.instruction {
    color: #ffd6e4;
    margin-top: 5px;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    50% { opacity: .4; }
}

@media(max-width: 480px) {
    .moon {
        width: 55px;
        height: 55px;
        right: 10%;
    }
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>
<div class="moon"></div>

<div class="container">
    <div class="rose" id="rose">
        <div class="stem"></div>
        <div class="leaf"></div>
        <div class="leaf right"></div>

        <div class="flower">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
        </div>
    </div>

    <p class="instruction" id="instruction">Click the rose to open 🌹</p>

    <h1 id="message">ROSE FOR YOU FROM AIM</h1>
    <p class="subtitle" id="subtitle">A little flower, with a lot of love. ♡</p>
</div>

<!-- Replace love-song.mp3 with your own music file or URL -->
<audio id="music" loop>
    <source src="love-song.mp3" type="audio/mpeg">
</audio>

<script>
// GENERATE STARS
const stars = document.getElementById("stars");

for (let i = 0; i < 120; i++) {
    const star = document.createElement("div");
    star.className = "star";

    const size = Math.random() * 3 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 3 + "s";
    star.style.animationDuration = (2 + Math.random() * 5) + "s";

    stars.appendChild(star);
}

// OPEN ROSE
const rose = document.getElementById("rose");
const message = document.getElementById("message");
const subtitle = document.getElementById("subtitle");
const instruction = document.getElementById("instruction");
const music = document.getElementById("music");

rose.addEventListener("click", () => {
    if (rose.classList.contains("open")) return;

    rose.classList.add("open");
    instruction.style.opacity = "0";

    setTimeout(() => {
        message.classList.add("show");
        subtitle.classList.add("show");
    }, 1800);

    music.play().catch(() => {
        console.log("Music requires a user interaction.");
    });
});
</script>

</body>
</html>
