```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rose For You From AIM 🌹</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(circle at 50% 70%, #17101b 0%, #090811 45%, #020308 100%);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* =========================
   NIGHT SKY
========================= */

.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
}

/* Stars */
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.5;
    animation:
        twinkle 2s ease-in-out infinite alternate,
        drift 12s linear infinite;
}

@keyframes twinkle {
    0% {
        opacity: 0.15;
        transform: scale(0.5);
    }

    50% {
        opacity: 0.8;
    }

    100% {
        opacity: 1;
        transform: scale(1.5);
    }
}

@keyframes drift {
    from {
        margin-left: 0;
        margin-top: 0;
    }

    to {
        margin-left: 25px;
        margin-top: -35px;
    }
}

/* Moon */
.moon {
    position: absolute;
    width: 85px;
    height: 85px;
    border-radius: 50%;

    right: 12%;
    top: 9%;

    background:
        radial-gradient(circle at 35% 30%,
        #fffde8 0%,
        #e7dfc5 55%,
        #aaa58f 100%);

    box-shadow:
        0 0 25px rgba(255, 242, 190, 0.35),
        0 0 80px rgba(255, 242, 190, 0.12);
}

/* =========================
   MAIN
========================= */

.scene {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    perspective: 1000px;
}

/* =========================
   ROSE
========================= */

.rose-container {
    position: relative;

    width: 220px;
    height: 420px;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    cursor: pointer;
}

/* Stem */

.stem {
    position: absolute;

    width: 7px;
    height: 235px;

    top: 145px;
    left: 50%;

    transform: translateX(-50%);

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #07150b,
            #173d20,
            #285c30,
            #0a1c0e
        );

    box-shadow:
        inset 1px 0 rgba(255,255,255,0.08),
        3px 0 8px rgba(0,0,0,0.5);
}

/* Leaves */

.leaf {
    position: absolute;

    width: 75px;
    height: 34px;

    top: 250px;
    left: 34px;

    background:
        linear-gradient(
            135deg,
            #071c0d,
            #174a22,
            #0a2812
        );

    border-radius: 100% 0 100% 0;

    transform: rotate(25deg);

    box-shadow:
        inset 0 0 8px rgba(94, 180, 100, 0.15),
        0 5px 10px rgba(0,0,0,0.5);
}

.leaf::after {
    content: "";

    position: absolute;

    width: 65px;
    height: 2px;

    background: rgba(110, 180, 110, 0.15);

    top: 17px;
    left: 5px;

    transform: rotate(-18deg);
}

.leaf.right {
    left: 110px;
    top: 295px;

    transform: scaleX(-1) rotate(20deg);
}

/* =========================
   FLOWER
========================= */

.flower {
    position: absolute;

    width: 190px;
    height: 190px;

    top: 20px;
    left: 50%;

    transform:
        translateX(-50%)
        scale(0.78);

    transition:
        transform 2.2s cubic-bezier(0.2, 0.8, 0.2, 1);

    filter:
        drop-shadow(0 15px 20px rgba(0,0,0,0.75))
        drop-shadow(0 0 25px rgba(100,0,20,0.18));
}

/* Petals */

.petal {
    position: absolute;

    width: 105px;
    height: 145px;

    left: 42px;
    top: 40px;

    transform-origin: 50% 95%;

    background:
        radial-gradient(
            ellipse at 40% 20%,
            #9b273c 0%,
            #671528 35%,
            #350916 70%,
            #150207 100%
        );

    border-radius:
        55% 55% 48% 48% /
        70% 70% 35% 35%;

    box-shadow:
        inset -10px -12px 20px rgba(0,0,0,0.55),
        inset 8px 7px 18px rgba(255,80,100,0.12),
        0 5px 15px rgba(0,0,0,0.55);

    transition:
        transform 2.2s cubic-bezier(0.15,0.8,0.2,1);
}

/* Dark petal shading */

.petal::before {
    content: "";

    position: absolute;

    inset: 10px;

    border-radius: inherit;

    background:
        radial-gradient(
            ellipse at 50% 20%,
            rgba(255,110,130,0.15),
            transparent 60%
        );
}

/* Closed rose arrangement */

.petal:nth-child(1) {
    transform: rotate(0deg) translateY(-8px);
    z-index: 5;
}

.petal:nth-child(2) {
    transform: rotate(72deg) translateY(-8px);
    z-index: 4;
}

.petal:nth-child(3) {
    transform: rotate(144deg) translateY(-8px);
    z-index: 3;
}

.petal:nth-child(4) {
    transform: rotate(216deg) translateY(-8px);
    z-index: 2;
}

.petal:nth-child(5) {
    transform: rotate(288deg) translateY(-8px);
    z-index: 1;
}

/* Inner petals */

.inner {
    position: absolute;

    width: 90px;
    height: 105px;

    left: 50px;
    top: 58px;

    background:
        radial-gradient(
            ellipse at 45% 15%,
            #b9344d,
            #5c1023 45%,
            #21030d 100%
        );

    border-radius: 50% 50% 45% 45%;

    box-shadow:
        inset -10px -10px 15px rgba(0,0,0,0.6);

    z-index: 10;

    transform-origin: bottom center;

    transition:
        transform 2s ease;
}

/* Rose center */

.center {
    position: absolute;

    width: 45px;
    height: 55px;

    left: 73px;
    top: 82px;

    border-radius:
        50% 50% 45% 45%;

    background:
        radial-gradient(
            ellipse at 45% 25%,
            #b53b51,
            #3c0716 65%,
            #120107
        );

    z-index: 15;

    box-shadow:
        inset -7px -7px 12px rgba(0,0,0,0.7);
}

/* =========================
   OPEN ANIMATION
========================= */

.rose-container.open .flower {
    transform:
        translateX(-50%)
        scale(1.05);
}

.rose-container.open .petal:nth-child(1) {
    transform:
        rotate(-10deg)
        translateY(-45px)
        scale(1.05);
}

.rose-container.open .petal:nth-child(2) {
    transform:
        rotate(55deg)
        translate(48px,-8px)
        scale(1.05);
}

.rose-container.open .petal:nth-child(3) {
    transform:
        rotate(125deg)
        translate(48px,10px)
        scale(1.05);
}

.rose-container.open .petal:nth-child(4) {
    transform:
        rotate(235deg)
        translate(-48px,10px)
        scale(1.05);
}

.rose-container.open .petal:nth-child(5) {
    transform:
        rotate(305deg)
        translate(-48px,-8px)
        scale(1.05);
}

.rose-container.open .inner {
    transform:
        translateY(-18px)
        scale(1.05);
}

/* =========================
   MESSAGE
========================= */

.message {
    position: absolute;

    left: 50%;
    top: 82px;

    width: 400px;

    transform:
        translate(-50%, 50px)
        scale(0.7);

    opacity: 0;

    pointer-events: none;

    text-align: center;

    font-size: clamp(22px, 5vw, 38px);

    letter-spacing: 3px;

    font-weight: bold;

    color: #f4d8de;

    text-shadow:
        0 0 5px rgba(255,180,195,0.5),
        0 0 20px rgba(180,20,55,0.7),
        0 0 45px rgba(120,0,30,0.5);

    transition:
        opacity 1.4s ease,
        transform 2.2s cubic-bezier(0.15,0.8,0.2,1);

    z-index: 50;
}

/*
   Message begins inside the rose
   then rises above it.
*/

.rose-container.open .message {
    opacity: 1;

    transform:
        translate(-50%, -30px)
        scale(1);
}

/* Small subtitle */

.subtitle {
    position: absolute;

    top: 135px;
    left: 50%;

    width: 350px;

    transform:
        translate(-50%, 30px);

    opacity: 0;

    color: #b99ca5;

    font-size: 14px;

    letter-spacing: 2px;

    text-align: center;

    transition:
        opacity 2s ease 1s,
        transform 2s ease 1s;
}

.rose-container.open .subtitle {
    opacity: 1;

    transform:
        translate(-50%, 0);
}

/* =========================
   CLICK TEXT
========================= */

.click-text {
    position: absolute;

    top: 370px;

    width: 100%;

    text-align: center;

    color: #b88c98;

    font-size: 13px;

    letter-spacing: 2px;

    animation: breathe 2s infinite ease-in-out;

    transition: opacity 0.7s ease;
}

.rose-container.open .click-text {
    opacity: 0;
}

@keyframes breathe {
    0%,
    100% {
        opacity: 0.35;
    }

    50% {
        opacity: 0.9;
    }
}

/* =========================
   FLOATING PARTICLES
========================= */

.particle {
    position: fixed;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: rgba(255,150,170,0.55);

    pointer-events: none;

    z-index: 2;

    animation:
        particleFloat 8s linear infinite;
}

@keyframes particleFloat {
    from {
        transform:
            translateY(30px)
            translateX(0);
        opacity: 0;
    }

    20% {
        opacity: 0.7;
    }

    80% {
        opacity: 0.7;
    }

    to {
        transform:
            translateY(-100vh)
            translateX(80px);
        opacity: 0;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .rose-container {
        transform: scale(0.82);
    }

    .message {
        width: 90vw;

        font-size: 24px;

        letter-spacing: 2px;
    }

    .subtitle {
        width: 85vw;
    }

    .moon {
        width: 55px;
        height: 55px;
        right: 8%;
        top: 8%;
    }
}
</style>
</head>

<body>

<!-- =========================
     NIGHT SKY
========================= -->

<div class="sky" id="sky">

    <div class="moon"></div>

</div>


<!-- =========================
     MAIN SCENE
========================= -->

<div class="scene">

    <div class="rose-container" id="rose">

        <!-- STEM -->
        <div class="stem"></div>

        <!-- LEAVES -->
        <div class="leaf"></div>
        <div class="leaf right"></div>


        <!-- FLOWER -->
        <div class="flower">

            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>

            <div class="inner"></div>

            <div class="center"></div>

        </div>


        <!-- MESSAGE -->
        <div class="message">
            ROSE FOR YOU FROM AIM
        </div>

        <div class="subtitle">
            A little flower, with a lot of love. ♡
        </div>


        <!-- INSTRUCTION -->
        <div class="click-text">
            CLICK THE ROSE 🌹
        </div>

    </div>

</div>


<!-- =========================
     MUSIC
========================= -->

<audio id="music" loop preload="auto">

    <source
        src="love-song.mp3"
        type="audio/mpeg">

</audio>


<script>

/* ==================================
   CREATE STARS
================================== */

const sky = document.getElementById("sky");

for (let i = 0; i < 160; i++) {

    const star = document.createElement("div");

    star.className = "star";

    const size =
        Math.random() * 2.5 + 0.5;

    star.style.width =
        size + "px";

    star.style.height =
        size + "px";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 5 + "s";

    star.style.animationDuration =
        (5 + Math.random() * 10) + "s";

    sky.appendChild(star);
}


/* ==================================
   FLOATING PARTICLES
================================== */

for (let i = 0; i < 35; i++) {

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "vw";

    particle.style.top =
        (80 + Math.random() * 30) + "vh";

    particle.style.animationDelay =
        Math.random() * 8 + "s";

    particle.style.animationDuration =
        (6 + Math.random() * 7) + "s";

    sky.appendChild(particle);
}


/* ==================================
   ROSE CLICK
================================== */

const rose =
    document.getElementById("rose");

const music =
    document.getElementById("music");


rose.addEventListener("click", () => {

    if (rose.classList.contains("open")) {
        return;
    }

    /* Open rose */
    rose.classList.add("open");


    /* Start music */

    music.volume = 0.45;

    music.play().catch(() => {

        console.log(
            "Music playback needs user interaction."
        );

    });

});

</script>

</body>
</html>
```
